name: LobbySystem
version: '${version}'
main: de.maximanu.lobbySystem.LobbySystem
api-version: '1.21'
load: POSTWORLD
description: Modern lobby plugin for Paper and Folia servers
author: M4xi2312
folia-supported: true
permissions:
  lobbysystem.set:
    description: Allows setting spawn
    default: op
  lobbysystem.build:
    description: Allows toggling build mode
    default: op
  lobbysystem.reload:
    description: Allows reloading the plugin config
    default: op
