# =========================================================
# LobbySystem Configuration
# Paper 1.21.11 / 26.1.x / 26.2 / Folia-ready lobby utilities
# All lobby mechanics only run in the configured lobby world.
# MiniMessage is supported in messages.yml and server names/lore.
# =========================================================

# This world is the scope for all lobby-only features.
lobby:
  world: world

# Spawn commands and automatic lobby teleports.
spawn:
  enabled: true
  teleport:
    on-join: true
    on-respawn: true
    on-void: true
  location:
    world: world
    x: 0.5
    y: 90.0
    z: 0.5
    yaw: 90
    pitch: 0

# Join/quit message management.
join:
  enabled: true
  hide-join-message: true
  hide-quit-message: true
  custom-join-message: "<gradient:#7EE8FA:#5AA9FF>+</gradient> <#E8E8E8>{player}"
  custom-quit-message: "<gradient:#FF8FA3:#FFB3C1>-</gradient> <#E8E8E8>{player}"

# Lobby protection. These settings only apply inside the configured lobby world.
protection:
  enabled: true
  damage: true
  hunger: true
  block-break: true
  block-place: true
  interact: true
  entity-interact: true
  inventory: true
  item-drop: true
  item-pickup: true
  farmland-trample: true
  mob-spawning: true
  portal-use: true
  buckets: true
  armor-stand-edit: true
  item-frame-rotate: true
  hanging-break: true
  environment:
    # Uses vanilla gamerules for low-cost time/weather locking in the lobby world.
    manage-gamerules: true
    weather-lock: true
    time-lock: true
    locked-time: 6000

# Double jump movement settings.
double-jump:
  enabled: true
  forward-boost: 1.15
  upward-boost: 0.82
  cooldown-ticks: 30
  xp-bar-cooldown: true

# Build mode is stored per player and only applies inside the lobby world.
build-mode:
  enabled: true
  allow-flight: false
  disable-double-jump: true
  reset-on-quit: true

# Custom lobby items are only given in the lobby world while build mode is off.
# Each item is a free-form entry: enabled/slot/material/action are required, name/lore are
# MiniMessage strings. Add, remove, or reorder items freely - the id (map key) just has to be unique.
# Available actions:
#   links            - shows the configured links (see the "links" section below)
#   server-selector  - opens the server selector menu
#   player-hider     - toggles player visibility (all / staff only / hidden)
#   cosmetics-menu   - opens the cosmetics menu (see the "cosmetics" section below)
#   run-command      - runs the command in "value" as the player, e.g. value: "spawn"
#   run-script       - has no built-in behavior; every item use (regardless of action) fires the
#                      cancellable de.maximanu.lobbySystem.event.LobbyItemUseEvent Bukkit event with
#                      the item id and "value" attached, so external plugins/scripts (e.g. Skript via
#                      "on <event>:" - exact syntax depends on your Skript version/addons) can react
#                      to it or take over the click entirely by cancelling the event.
#   show-text        - sends the "message" lines below to chat. Each line is a MiniMessage string
#                      with an optional click action (open-url, run-command, suggest-command, copy)
#                      and hover text. {player} is replaced with the clicking player's name.
hotbar:
  enabled: true
  lock-items: true
  items:
    info:
      enabled: true
      slot: 0
      material: BOOK
      action: links
      name: "<gradient:#F5F7FA:#D7DDE8>Lobby Info"
      lore:
        - "<#6E6E6E>- <#E8E8E8>View links and useful information"
        - "<#6E6E6E>- <#F5F7FA>Right-click to open"
    server-selector:
      enabled: true
      slot: 4
      material: COMPASS
      action: server-selector
      name: "<gradient:#FFE082:#FFB347>Server Selector"
      lore:
        - "<#6E6E6E>- <#E8E8E8>Choose where you want to play"
        - "<#6E6E6E>- <#FFD166>Right-click to open"
    player-hider:
      enabled: true
      slot: 8
      material: PLAYER_HEAD
      action: player-hider
      # name/lore are generated dynamically from the current visibility state - see messages.yml "hotbar.hider".
    rules:
      enabled: true
      slot: 2
      material: WRITTEN_BOOK
      action: show-text
      name: "<gradient:#F5F7FA:#D7DDE8>Rules & Info"
      lore:
        - "<#6E6E6E>- <#F5F7FA>Right-click to open"
      message:
        - text: "<gray>Welcome, <white>{player}<gray>!"
        - text: "<aqua>Click to open our website"
          click: open-url
          value: "https://example.com"
          hover: "<gray>Opens in your browser"
        - text: "<yellow>Click to copy our IP"
          click: copy
          value: "play.example.com"
          hover: "<gray>Copies to your clipboard"
        - text: "<green>Click to run /spawn"
          click: run-command
          value: "spawn"
        - text: "<light_purple>Click to suggest a message"
          click: suggest-command
          value: "/msg "
    cosmetics:
      enabled: true
      slot: 6
      material: JACK_O_LANTERN
      action: cosmetics-menu
      name: "<gradient:#B39DFF:#7EE8FA>Cosmetics"
      lore:
        - "<#6E6E6E>- <#E8E8E8>Hats, particles & gadgets"
        - "<#6E6E6E>- <#B39DFF>Right-click to open"
    # Example of a fully custom item using the generic run-command action - disabled by default:
    # hub:
    #   enabled: false
    #   slot: 2
    #   material: NETHER_STAR
    #   action: run-command
    #   value: spawn
    #   name: "<gold>Hub"
    #   lore: []
    # Example of an item whose behavior is entirely defined by a script listening to
    # LobbyItemUseEvent - "value" is just a free-form tag your script can check:
    # magic-wand:
    #   enabled: false
    #   slot: 3
    #   material: BLAZE_ROD
    #   action: run-script
    #   value: magic-wand-trigger
    #   name: "<light_purple>Magic Wand"
    #   lore: []

# Server selector menu and backend destinations.
server-selector:
  enabled: true
  menu:
    size: 27
    layout-slots: [10, 11, 12, 14, 15, 16]
    previous-page-slot: 18
    next-page-slot: 26
    fill-empty-slots: true
    filler-material: LIGHT_GRAY_STAINED_GLASS_PANE
  servers:
    ffa:
      name: "<gradient:#FFE082:#FFB347>FFA"
      bungee: "ffa"
      item: "BOW"
      slot: 11
      lore:
        - "<#6E6E6E>- <#E8E8E8>Fast-paced fights with instant action"
        - "<#6E6E6E>- <#FFD166>Click to connect"
    duels:
      name: "<gradient:#7EE8FA:#5AA9FF>Duels"
      bungee: "duels"
      item: "DIAMOND_SWORD"
      slot: 15
      lore:
        - "<#6E6E6E>- <#E8E8E8>1v1, ranked, and quick matches"
        - "<#6E6E6E>- <#7EE8FA>Click to connect"

# Message delivery for feature feedback.
feedback:
  # Allowed values: chat, actionbar, none
  spawn-set: chat
  spawn-teleport: actionbar
  build-mode: actionbar
  visibility-toggle: none
  server-selector-connect: actionbar

# Link output for the lobby info item.
links:
  enabled: true
  entries:
    website: "https://example.com"
    discord: "https://discord.gg/example"
    store: "https://store.example.com"

# Optional sound feedback for interactions and state changes.
sounds:
  enabled: true
  entries:
    double-jump:
      name: "minecraft:entity.breeze.jump"
      volume: 0.95
      pitch: 1.15
    double-jump-deny:
      name: "minecraft:block.note_block.bass"
      volume: 0.65
      pitch: 0.8
    selector-open:
      name: "minecraft:ui.button.click"
      volume: 0.8
      pitch: 1.15
    info:
      name: "minecraft:item.book.page_turn"
      volume: 0.75
      pitch: 1.0
    hider-toggle:
      name: "minecraft:entity.experience_orb.pickup"
      volume: 0.75
      pitch: 1.15
    teleport:
      name: "minecraft:entity.enderman.teleport"
      volume: 0.85
      pitch: 1.05
    build-mode-enable:
      name: "minecraft:block.beacon.power_select"
      volume: 0.8
      pitch: 1.25
    build-mode-disable:
      name: "minecraft:block.beacon.deactivate"
      volume: 0.8
      pitch: 0.95

# Cosmetics menu: hats (worn on the head), particle trails, and gadgets (usable toy items).
# Selections persist per player across restarts. An empty/missing "permission" means unlocked for
# everyone. Kinds:
#   hat       - toggled on/off from the menu, worn in the helmet slot
#   particle  - toggled on/off from the menu, ticks a "particle" effect at the player's feet every
#               "interval-ticks" while they're in the lobby world
#   gadget    - clicking it in the menu gives the item; right-clicking the item triggers "effect"
#               (firework / grappling-hook / pearl-bow) + the optional "sound", then starts a
#               "cooldown-ticks" cooldown
cosmetics:
  enabled: true
  menu:
    size: 54
  items:
    party-hat:
      kind: hat
      enabled: true
      material: JACK_O_LANTERN
      name: "<gold>Party Hat"
      lore:
        - "<#6E6E6E>- <#E8E8E8>A festive head accessory"
      permission: ""
    diamond-crown:
      kind: hat
      enabled: true
      material: DIAMOND_HELMET
      name: "<aqua>Diamond Crown"
      lore:
        - "<#6E6E6E>- <#E8E8E8>For VIPs only"
      permission: "cosmetics.hat.diamond-crown"
    flame-trail:
      kind: particle
      enabled: true
      material: BLAZE_POWDER
      name: "<red>Flame Trail"
      lore:
        - "<#6E6E6E>- <#E8E8E8>Leaves a trail of flames"
      particle: FLAME
      interval-ticks: 5
      permission: ""
    heart-trail:
      kind: particle
      enabled: true
      material: POPPY
      name: "<light_purple>Heart Trail"
      lore:
        - "<#6E6E6E>- <#E8E8E8>Leaves a trail of hearts"
      particle: HEART
      interval-ticks: 8
      permission: ""
    firework-launcher:
      kind: gadget
      enabled: true
      material: FIREWORK_ROCKET
      name: "<yellow>Firework Launcher"
      lore:
        - "<#6E6E6E>- <#E8E8E8>Right-click to launch fireworks"
      effect: firework
      cooldown-ticks: 100
      sound:
        name: "minecraft:entity.firework_rocket.blast"
        volume: 1.0
        pitch: 1.0
      permission: ""
    grappling-hook:
      kind: gadget
      enabled: true
      material: FISHING_ROD
      name: "<green>Grappling Hook"
      lore:
        - "<#6E6E6E>- <#E8E8E8>Right-click to pull yourself forward"
      effect: grappling-hook
      cooldown-ticks: 60
      sound:
        name: "minecraft:entity.arrow.shoot"
        volume: 0.9
        pitch: 1.3
      permission: ""
    pearl-bow:
      kind: gadget
      enabled: true
      material: BOW
      name: "<light_purple>Pearl Bow"
      lore:
        - "<#6E6E6E>- <#E8E8E8>Right-click to launch yourself with an ender pearl"
      effect: pearl-bow
      cooldown-ticks: 60
      sound:
        name: "minecraft:entity.enderman.teleport"
        volume: 0.9
        pitch: 1.1
      permission: ""
